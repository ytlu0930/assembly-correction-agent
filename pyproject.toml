[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "assembly-correction-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.13,<3",
    "pillow>=12.3,<13",
]

[project.optional-dependencies]
grounding = [
    "torch>=2.7",
    "torchvision>=0.22",
    "transformers>=4.57",
]

[tool.setuptools.packages.find]
where = ["src"]

